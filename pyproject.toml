[tool.poetry]
name = "cutstudio"
version = "5.0.0"
description = "AI-Powered Video Editor for Educational Content"
authors = ["Kelly <contact@cutstudio.ai>"]
license = "MIT"
readme = "README_V5.md"
homepage = "https://github.com/yourusername/cutstudio-v5"
repository = "https://github.com/yourusername/cutstudio-v5"
documentation = "https://cutstudio.readthedocs.io"
keywords = ["video", "editor", "ai", "education", "whisper", "gemini"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
streamlit = "^1.29.0"
uvicorn = "^0.24.0"
ffmpeg-python = "^0.2.0"
librosa = "^0.10.1"
openai-whisper = "^20231117"
google-generativeai = "^0.3.0"
sqlalchemy = "^2.0.23"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
pre-commit = "^3.5.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.6"
mkdocs = "^1.5.3"
mkdocs-material = "^9.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "ISC", "PIE", "PT", "RET", "SIM", "TID"]
ignore = ["E501"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --cov=src --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false