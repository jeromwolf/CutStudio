version: '3.8'

services:
  cutstudio:
    build: .
    container_name: cutstudio-app
    ports:
      - "8501:8501"
    volumes:
      # 개발 중 코드 변경사항 실시간 반영
      - ./app.py:/app/app.py
      - ./video_editor.py:/app/video_editor.py
      - ./youtube_downloader.py:/app/youtube_downloader.py
      - ./utils.py:/app/utils.py
      - ./services:/app/services
      # 데이터 볼륨
      - ./temp:/app/temp
      - ./processed:/app/processed
      - ./exports:/app/exports
    environment:
      # 환경 변수 설정
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=500
    restart: unless-stopped